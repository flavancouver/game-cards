<div id="app" style="display:flex;min-height:100vh;width:100%;background:#f4f4f5;font-family:'Helvetica Neue',Arial,sans-serif;color:#18181b;">

    <div>

  // ---- helpers ----
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    if (!t) return '';

    var ap = H >= 12 ? 'PM' : 'AM';
    var h = H % 12; if (h === 0) h = 12;
    return h + ':' + String(M).padStart(2, '0') + ' ' + ap;

    if (!state.opponent) { state.dlError = 'Choose an opponent to continue.'; render(); return; }
    if (state.opponent === 'other' && !state.customOpp.trim()) { state.dlError = "Enter the opponent's name."; render(); return; }
    if (state.venue === 'other') {
      var vn = state.customName.trim(), va = state.customAddress.trim();
      if (!vn && !va) { state.dlError = 'Enter the venue name and address.'; render(); return; }
      if (!vn) { state.dlError = 'Enter the venue name.'; render(); return; }
      if (!va) { state.dlError = 'Enter the venue address.'; render(); return; }
    }
    if (state.downloading) return;
    state.downloading = true; state.dlError = ''; render();
    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontsReady.then(function () {
      // Wait for crest/background images to finish loading so none are filtered out of the export.
      var imgs = [].slice.call(graphic.querySelectorAll('img'));
      return Promise.all(imgs.map(function (im) {
        return (im.complete && im.naturalWidth > 0) ? null : new Promise(function (res) { im.onload = im.onerror = res; });
      }));
    }).then(function () {
      return window.htmlToImage.toPng(graphic, {
        width: 1080, height: 1080, pixelRatio: 1, cacheBust: true,
        style: { transform: 'none' },
        filter: function (node) { return !(node.tagName === 'IMG' && node.naturalWidth === 0); },
      });
    }).then(function (url) {
      var slug = function (n) { return n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-').replace(/[^A-Za-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, ''); };
      var home = state.homeAway === 'home';
      var advName = oppDisplayName() || 'Opponent';
      var t1 = slug(home ? 'Flamengo' : advName);
      var t2 = slug(home ? advName : 'Flamengo');
      var a = document.createElement('a');
      a.download = state.data + '_' + t1 + '-x-' + t2 + '.png';
      a.href = url;
      a.click();
      state.downloading = false; render();
    }).catch(function (e) {
      console.error(e);
      alert('Erro ao gerar a imagem: ' + e.message);
      state.downloading = false; render();
    });
  }

  // ---- calendar ----
  function buildDateData() {
    var parts = (state.data || '').split('-').map(Number);
    var dt = (parts.length === 3 && !parts.some(isNaN)) ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date();
    return dt;
  }

  function renderCalendar() {
    var dt = buildDateData();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var maxD = new Date(today); maxD.setMonth(maxD.getMonth() + 6);
    var dateMin = iso(today), dateMax = iso(maxD);
    var viewY = state.calY != null ? state.calY : dt.getFullYear();
    var viewM = state.calM != null ? state.calM : dt.getMonth();
    var lead = new Date(viewY, viewM, 1).getDay();
    var dim = new Date(viewY, viewM + 1, 0).getDate();
    var todayIso = iso(today);

    calLabel.textContent = ptMonth(viewM) + ' ' + viewY;
    var viewIdx = viewY * 12 + viewM;
    var minIdx = today.getFullYear() * 12 + today.getMonth();
    var maxIdx = maxD.getFullYear() * 12 + maxD.getMonth();
    $('calPrev').disabled = viewIdx <= minIdx;
    $('calNext').disabled = viewIdx >= maxIdx;

    calGrid.innerHTML = '';
    for (var i = 0; i < 42; i++) {
      var dayNum = i - lead + 1;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ff-day';
      if (dayNum < 1 || dayNum > dim) {
        btn.setAttribute('data-empty', '1');
        btn.disabled = true;
        btn.textContent = '';
        calGrid.appendChild(btn);
        continue;
      }
      var cellIso = iso(new Date(viewY, viewM, dayNum));
      var disabled = cellIso < dateMin || cellIso > dateMax;
      var selected = cellIso === state.data;
      btn.setAttribute('data-empty', '0');
      btn.disabled = disabled;
      btn.setAttribute('data-state', selected ? 'selected' : (cellIso === todayIso ? 'today' : ''));
      btn.textContent = String(dayNum);
      (function (ci, dis) {
        btn.addEventListener('click', function () {
          if (dis) return;
          state.data = ci; state.calOpen = false; render();
        });
      })(cellIso, disabled);
      calGrid.appendChild(btn);
    }
  }

  function stepMonth(delta) {
    var dt = buildDateData();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var maxD = new Date(today); maxD.setMonth(maxD.getMonth() + 6);
    var minIdx = today.getFullYear() * 12 + today.getMonth();
    var maxIdx = maxD.getFullYear() * 12 + maxD.getMonth();
    var by = state.calY != null ? state.calY : dt.getFullYear();
    var bm = state.calM != null ? state.calM : dt.getMonth();
    var idx = Math.min(maxIdx, Math.max(minIdx, by * 12 + bm + delta));
    state.calY = Math.floor(idx / 12); state.calM = idx % 12;
    render();
  }

  // ---- opponent dropdown ----
  function renderOppDropdown() {
    oppDropdown.innerHTML = '';
    var q = norm(state.oppQuery);
    var oppList = (state.oppDirty && q) ? OPP.filter(function (o) { return norm(o.name).includes(q); }) : OPP.slice();
    var rows = oppList.map(function (o) { return { key: o.key, name: o.name, other: false }; });
    rows.push({ key: 'other', name: 'Other (enter name)…', other: true });

    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'ff-oppRow';
      row.style.cssText = 'padding:9px 10px;font-size:15px;color:#18181b;cursor:pointer;display:flex;align-items:center;gap:11px;border-radius:6px;';
      var img = document.createElement('img');
      img.style.cssText = 'width:24px;height:24px;object-fit:contain;flex:none;';
      if (r.other || !hasCrest(r.key)) {
        img.style.visibility = 'hidden';
      } else {
        img.style.visibility = 'visible';
        img.src = crestSrc(r.key);
        img.onerror = function () { img.style.visibility = 'hidden'; };
      }
      var span = document.createElement('span');
      span.textContent = r.name;
      row.appendChild(img); row.appendChild(span);
      row.addEventListener('mousedown', function (e) {
        e.preventDefault();
        pickOpp({ key: r.key });
      });
      oppDropdown.appendChild(row);
    });

    if (oppList.length === 0) {
      // "No team found" appears above the always-present Other row when the filter matches nothing.
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:11px 12px;font-size:14px;color:#a1a1aa;';
      empty.textContent = 'No team found';
      oppDropdown.insertBefore(empty, oppDropdown.lastChild);
    }
  }

  // ---- side (team column) renderer ----
  function renderSide(container, t, miss) {
    container.innerHTML = '';
    var box = document.createElement('div');
    box.style.cssText = 'position:relative;width:212px;height:176px;display:flex;align-items:center;justify-content:center;';
    var showBadge = miss || !!t.badge;
    var hasImg = !t.empty && !t.badge && !miss;
    if (showBadge) {
      var badge = document.createElement('div');
      badge.style.cssText = 'width:142px;height:142px;border-radius:50%;background:#2a2a2a;border:3px solid #4a4a4a;color:#fff;font-family:\'Oswald\',sans-serif;font-weight:700;font-size:42px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;';
      badge.textContent = t.initials;
      box.appendChild(badge);
    } else if (hasImg) {
      var img = document.createElement('img');
      img.style.objectFit = 'contain';
      img.src = t.src;
      img.style.width = (t.fla ? 188 : 164) + 'px';
      img.style.height = (t.fla ? 172 : 150) + 'px';
      box.appendChild(img);
    } else if (t.empty) {
      var ph = document.createElement('div');
      ph.style.cssText = 'width:142px;height:142px;border-radius:50%;border:2px dashed rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.28);font-family:\'Oswald\',sans-serif;font-weight:700;font-size:60px;line-height:1;';
      ph.textContent = '?';
      box.appendChild(ph);
    }
    var name = document.createElement('div');
    name.style.cssText = 'max-width:320px;font-family:\'Oswald\',sans-serif;font-weight:600;font-size:23px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(255,255,255,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;';
    name.textContent = t.name || ' ';
    container.appendChild(box);
    container.appendChild(name);
  }

  // ---- main render ----
  function render() {
    var s = state;
    var p = (s.horario || '17:00').split(':').map(Number), H = p[0], M = p[1];
    var dt = buildDateData();
    var weekday = ptWeekday(dt.getDay());
    var wkAbbr = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
    var moAbbr = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
    var dateDisplay = wkAbbr + ', ' + moAbbr + ' ' + dt.getDate() + ', ' + dt.getFullYear();
    var dateLine = (dt.getDate() + ' ' + ptMonth(dt.getMonth())).toUpperCase();
    var timeLine = ampm(s.horario);
    var tzLabel = s.horario ? 'PT' : '';
    var graphicYear = dt.getFullYear();

    // form: date display
    $('dateDisplay').textContent = dateDisplay;

    // form: competition/time selects (keep in sync)
    $('campSelect').value = s.campeonato;
    $('hourSelect').value = String(H % 12 || 12);
    $('minuteSelect').value = String(M).padStart(2, '0');
    // AM/PM segmented styling
    styleSeg($('amBtn'), H < 12, false);
    styleSeg($('pmBtn'), H >= 12, true);

    // form: venue
    var isOther = s.venue === 'other';
    $('venueSelect').value = s.venue;
    $('customVenueName').style.display = isOther ? '' : 'none';
    $('customVenueAddr').style.display = isOther ? '' : 'none';
    if (document.activeElement !== $('venueNameInput')) $('venueNameInput').value = s.customName;
    if (document.activeElement !== $('venueAddrInput')) $('venueAddrInput').value = s.customAddress;

    // form: home/away
    $('homeRadio').checked = s.homeAway === 'home';
    $('awayRadio').checked = s.homeAway === 'away';

    // form: opponent input + dropdown
    if (document.activeElement !== oppInput) oppInput.value = s.oppQuery;
    oppDropdown.style.display = s.oppOpen ? '' : 'none';
    if (s.oppOpen) renderOppDropdown();
    var isOtherOpp = s.opponent === 'other';
    customOppInput.style.display = isOtherOpp ? '' : 'none';
    if (document.activeElement !== customOppInput) customOppInput.value = s.customOpp;
    if (oppNameFocusPending && isOtherOpp) { oppNameFocusPending = false; setTimeout(function () { customOppInput.focus(); }, 0); }

    // form: calendar
    calPopover.style.display = s.calOpen ? '' : 'none';
    if (s.calOpen) renderCalendar();

    // form: download button disabled look
    var customOppName = s.customOpp.trim();
    var venueOk = !isOther || (!!s.customName.trim() && !!s.customAddress.trim());
    var okToDownload = !!s.opponent && (!isOtherOpp || !!customOppName) && venueOk;
    var dlBtn = $('dlBtn');
    dlBtn.style.opacity = okToDownload ? '1' : '0.5';
    dlBtn.style.cursor = okToDownload ? 'pointer' : 'not-allowed';
    dlBtn.setAttribute('data-disabled', okToDownload ? '0' : '1');
    $('dlLabel').textContent = s.downloading ? 'Generating…' : 'Download image';

    // form: error line
    $('dlError').textContent = s.dlError;
    $('dlErrorIcon').style.display = s.dlError ? '' : 'none';

    // card: header
    $('cardCompetition').textContent = s.campeonato || ' ';
    $('cardYear').textContent = graphicYear;
    $('cardWeekday').textContent = weekday;
    $('cardDateLine').textContent = dateLine;
    $('cardTime').textContent = timeLine;
    $('cardTz').textContent = tzLabel;

    // card: venue
    var v = VENUES.find(function (x) { return x.key === s.venue; });
    var vName = isOther ? s.customName : (v ? v.name : '');
    var vAddr = isOther ? s.customAddress : (v ? v.address : '');
    // On the "Other" venue, show ghosted placeholder copy until the fields are filled,
    // so the card never looks broken/empty and the text reads as a hint, not a real place.
    var nameEmpty = isOther && !s.customName.trim();
    var addrEmpty = isOther && !s.customAddress.trim();
    var nameEl = $('cardVenueName'), addrEl = $('cardVenueAddr'), pinEl = $('cardVenuePin');
    nameEl.textContent = nameEmpty ? 'Venue name' : (vName || ' ');
    nameEl.style.color = nameEmpty ? 'rgba(255,255,255,0.45)' : '#fff';
    addrEl.textContent = addrEmpty ? 'Street address' : (vAddr || ' ');
    addrEl.style.color = addrEmpty ? 'rgba(255,255,255,0.45)' : '#fff';
    pinEl.style.color = addrEmpty ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.7)';

    // card: teams
    var oppSel = (s.opponent && s.opponent !== 'other') ? oppByKey(s.opponent) : null;
    var advDisplay = oppDisplayName();
    var fla = { src: crestSrc('flamengo'), initials: 'FLA', name: 'Flamengo', fla: true };
    var adv;
    if (isOtherOpp) {
      adv = customOppName
        ? { badge: true, initials: initials(customOppName), name: customOppName, fla: false }
        : { empty: true, name: 'TBD', fla: false };
    } else if (oppSel) {
      adv = hasCrest(oppSel.key)
        ? { src: crestSrc(oppSel.key), initials: initials(advDisplay), name: advDisplay, fla: false }
        : { badge: true, initials: initials(advDisplay), name: advDisplay, fla: false };
    } else {
      adv = { empty: true, name: 'TBD', fla: false };
    }
    var home = s.homeAway === 'home';
    var left = home ? fla : adv;
    var right = home ? adv : fla;
    var lMiss = !left.empty && !left.badge && !!s.missing[left.src];
    var rMiss = !right.empty && !right.badge && !!s.missing[right.src];
    renderSide($('sideLeft'), left, lMiss);
    renderSide($('sideRight'), right, rMiss);

    // ensure crest existence checks
    ensureCrest(crestSrc('flamengo'));
    if (s.opponent && hasCrest(s.opponent)) ensureCrest(crestSrc(s.opponent));

    updateScale();
  }

  function styleSeg(btn, active, isPm) {
    btn.style.flex = '1';
    btn.style.padding = '11px 0';
    btn.style.border = 'none';
    btn.style.borderLeft = isPm ? '1px solid #d4d4d8' : 'none';
    btn.style.background = active ? '#18181b' : '#fff';
    btn.style.color = active ? '#fff' : '#71717a';
    btn.style.fontSize = '15px';
    btn.style.fontWeight = '600';
    btn.style.cursor = 'pointer';
    btn.style.transition = 'background .12s, color .12s';
  }

  // ---- events ----
  $('campSelect').addEventListener('change', function (e) { state.campeonato = e.target.value; render(); });
  $('hourSelect').addEventListener('change', function (e) { setTime('h', e.target.value); });
  $('minuteSelect').addEventListener('change', function (e) { setTime('m', e.target.value); });
  $('amBtn').addEventListener('click', function () { setTime('ap', 'AM'); });
  $('pmBtn').addEventListener('click', function () { setTime('ap', 'PM'); });

  $('venueSelect').addEventListener('change', function (e) { state.venue = e.target.value; render(); });
  $('venueNameInput').addEventListener('input', function (e) { state.customName = e.target.value; render(); });
  $('venueAddrInput').addEventListener('input', function (e) { state.customAddress = e.target.value; render(); });

  $('homeRadio').addEventListener('change', function () { state.homeAway = 'home'; render(); });
  $('awayRadio').addEventListener('change', function () { state.homeAway = 'away'; render(); });

  $('dateField').addEventListener('click', function () {
    if (state.calOpen) { state.calOpen = false; }
    else {
      var p = (state.data || '').split('-').map(Number);
      state.calOpen = true; state.calY = p[0] || null; state.calM = (p[1] ? p[1] - 1 : null);
    }
    render();
  });
  $('calPrev').addEventListener('click', function () { stepMonth(-1); });
  $('calNext').addEventListener('click', function () { stepMonth(1); });

  oppInput.addEventListener('input', function (e) { state.oppQuery = e.target.value; state.oppOpen = true; state.oppDirty = true; render(); });
  oppInput.addEventListener('focus', function (e) {
    state.oppOpen = true; state.oppDirty = false; render();
    var t = e.target; setTimeout(function () { try { t.select(); } catch (_) {} }, 0);
  });
  var _oppT;
  oppInput.addEventListener('blur', function () {
    clearTimeout(_oppT);
    _oppT = setTimeout(function () {
      var sel = (state.opponent && state.opponent !== 'other') ? oppByKey(state.opponent) : null;
      state.oppOpen = false; state.oppDirty = false;
      state.oppQuery = sel ? sel.name : (state.opponent === 'other' ? 'Other' : '');
      render();
    }, 140);
  });
  customOppInput.addEventListener('input', function (e) { state.customOpp = e.target.value; render(); });

  $('dlBtn').addEventListener('click', download);

  // Reset link in the header — reloads the page, clearing all fields back to defaults.
  $('resetLink').addEventListener('click', function (e) { e.preventDefault(); location.reload(); });

  // outside click / escape for calendar
  document.addEventListener('mousedown', function (e) {
    if (state.calOpen && dateWrap && !dateWrap.contains(e.target)) { state.calOpen = false; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.calOpen) { state.calOpen = false; render(); }
  });

  // resize
  window.addEventListener('resize', updateScale);
  if (window.ResizeObserver) { var ro = new ResizeObserver(updateScale); ro.observe(frame); }

  // On mobile, move the footer (socials + copyright) below the preview instead of
  // leaving it at the bottom of the form. Desktop keeps it pinned inside the sidebar.
  var siteFooter = $('siteFooter');
  var appEl = document.getElementById('app');
  var asideEl = document.querySelector('aside');
  var footerMq = window.matchMedia('(max-width: 900px)');
  function placeFooter() {
    if (footerMq.matches) {
      if (siteFooter.parentNode !== appEl) appEl.appendChild(siteFooter); // after <main>
    } else {
      if (siteFooter.parentNode !== asideEl) asideEl.appendChild(siteFooter); // back to sidebar bottom
    }
  }
  if (footerMq.addEventListener) footerMq.addEventListener('change', placeFooter);
  else if (footerMq.addListener) footerMq.addListener(placeFooter);
  placeFooter();

  // initial paint
  render();
  updateScale();
})();
</script>
</body>
</html>
