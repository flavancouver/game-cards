<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlaVancouver — Game Card Generator</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#C4271F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a { color: #C4271F; text-decoration: none; }
  a:hover { color: #9d1e18; }
  input, select, button { font-family: inherit; }
  select { -webkit-appearance: none; -moz-appearance: none; appearance: none; background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='12'%20height='8'%20viewBox='0%200%2012%208'%3E%3Cpath%20d='M1%201L6%206L11%201'%20fill='none'%20stroke='%2371717a'%20stroke-width='1.7'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; background-size: 12px 8px; padding-right: 38px !important; }
  .ff-input:focus { border-color: #C4271F !important; box-shadow: 0 0 0 3px rgba(196,39,31,0.12); }
  .ff-day { border: none; background: transparent; border-radius: 7px; height: 34px; font-size: 13px; font-weight: 600; color: #27272a; cursor: pointer; font-family: inherit; padding: 0; }
  .ff-day:hover:not(:disabled) { background: #f4f4f5; }
  .ff-day[data-state="today"] { box-shadow: inset 0 0 0 1.5px #d4d4d8; }
  .ff-day[data-state="selected"], .ff-day[data-state="selected"]:hover { background: #C4271F; color: #fff; box-shadow: none; }
  .ff-day:disabled { color: #d4d4d8; cursor: default; }
  .ff-day[data-empty="1"] { visibility: hidden; }
  .ff-daynav { border: none; background: #f4f4f5; border-radius: 7px; width: 30px; height: 30px; cursor: pointer; color: #3f3f46; font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center; font-family: inherit; padding: 0; }
  .ff-daynav:hover:not(:disabled) { background: #e4e4e7; }
  .ff-daynav:disabled { opacity: 0.35; cursor: default; }
  .ff-oppRow:hover { background: #f4f4f5; }
  .ff-social:hover { background: #C4271F !important; }
  .ff-ghlink:hover { color: #C4271F !important; }
  #dlBtn:hover:not([data-disabled="1"]) { background: #a41d16; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @media (max-width: 900px) {
    #app { flex-direction: column !important; height: auto !important; }
    #app > aside { width: 100% !important; height: auto !important; border-right: none !important; border-bottom: 1px solid #e4e4e7 !important; overflow-y: visible !important; padding: 28px 20px 32px !important; }
    #app > main { width: 100% !important; height: auto !important; padding: 24px 20px 40px !important; justify-content: flex-start !important; }
  }
</style>
</head>
<body>
<div id="app" style="display:flex;min-height:100vh;width:100%;background:#f4f4f5;font-family:'Helvetica Neue',Arial,sans-serif;color:#18181b;">

  <aside style="width:472px;flex:none;background:#fff;border-right:1px solid #e4e4e7;height:100vh;overflow-y:auto;padding:40px 40px 48px;display:flex;flex-direction:column;gap:22px;">
    <div style="display:flex;flex-direction:column;gap:9px;">
      <img src="assets/flavancouver-text.png" alt="Fla Vancouver" style="height:24px;width:auto;object-fit:contain;align-self:flex-start;" />
      <span style="font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.15em;text-transform:uppercase;color:#a1a1aa;">Game Card Generator</span>
    </div>

    <div style="border-top:1px solid #f0f0f1;padding-top:20px;">
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#71717a;margin-bottom:7px;">Competition</label>
      <select id="campSelect" class="ff-input" style="width:100%;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s;"></select>
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#71717a;margin-bottom:7px;">Date &amp; time</label>
      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="flex:1;">
          <div id="dateWrap" style="position:relative;">
            <div id="dateField" class="ff-input" style="width:100%;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box;">
              <span id="dateDisplay"></span>
            </div>
            <div id="calPopover" style="display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:288px;max-width:100%;background:#fff;border:1px solid #e4e4e7;border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,0.16);padding:14px;box-sizing:border-box;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <button type="button" id="calPrev" class="ff-daynav">‹</button>
                <div id="calLabel" style="font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:#18181b;text-transform:uppercase;letter-spacing:0.03em;"></div>
                <button type="button" id="calNext" class="ff-daynav">›</button>
              </div>
              <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;">
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">S</div>
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">M</div>
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">T</div>
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">W</div>
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">T</div>
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">F</div>
                <div style="text-align:center;font-size:10px;font-weight:700;color:#a1a1aa;padding:4px 0;">S</div>
              </div>
              <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;"></div>
            </div>
          </div>
        </div>
        <div style="flex:1;">
          <div style="display:flex;gap:8px;align-items:center;">
            <select id="hourSelect" class="ff-input" style="flex:1;min-width:0;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s;"></select>
            <span style="font-weight:700;font-size:18px;color:#a1a1aa;">:</span>
            <select id="minuteSelect" class="ff-input" style="flex:1;min-width:0;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s;"></select>
            <div style="display:flex;flex:1.5;min-width:0;margin-left:2px;border:1px solid #d4d4d8;border-radius:8px;overflow:hidden;">
              <button id="amBtn">AM</button>
              <button id="pmBtn">PM</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="border-top:1px solid #f0f0f1;padding-top:20px;">
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#71717a;margin-bottom:10px;">Flamengo</label>
      <div style="display:flex;gap:10px;">
        <label style="flex:1;display:flex;align-items:center;gap:9px;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">
          <input type="radio" name="homeaway" id="homeRadio" style="accent-color:#C4271F;width:16px;height:16px;" />
          Home
        </label>
        <label style="flex:1;display:flex;align-items:center;gap:9px;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">
          <input type="radio" name="homeaway" id="awayRadio" style="accent-color:#C4271F;width:16px;height:16px;" />
          Away
        </label>
      </div>
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#71717a;margin-bottom:7px;">Opponent</label>
      <div style="position:relative;">
        <input id="oppInput" placeholder="Type to search for a team…" class="ff-input" style="width:100%;padding:11px 38px 11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;outline:none;transition:border-color .15s,box-shadow .15s;box-sizing:border-box;" />
        <i class="fa-solid fa-magnifying-glass" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#a1a1aa;font-size:13px;pointer-events:none;"></i>
        <div id="oppDropdown" style="display:none;position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;max-height:264px;overflow-y:auto;background:#fff;border:1px solid #d4d4d8;border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,0.16);padding:5px;"></div>
      </div>
      <input id="customOppInput" class="ff-input" type="text" placeholder="Opponent name" style="display:none;width:100%;margin-top:8px;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;outline:none;box-sizing:border-box;" />
    </div>

    <div style="border-top:1px solid #f0f0f1;padding-top:20px;display:flex;flex-direction:column;gap:14px;">
      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#71717a;margin-bottom:7px;">Venue</label>
        <select id="venueSelect" class="ff-input" style="width:100%;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background-color:#fff;outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s;"></select>
      </div>
      <div id="customVenueName" style="display:none;">
        <label style="display:block;font-size:11px;font-weight:600;color:#a1a1aa;margin-bottom:6px;">Venue name</label>
        <input id="venueNameInput" class="ff-input" type="text" placeholder="Venue name" style="width:100%;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;" />
      </div>
      <div id="customVenueAddr" style="display:none;">
        <label style="display:block;font-size:11px;font-weight:600;color:#a1a1aa;margin-bottom:6px;">Address</label>
        <input id="venueAddrInput" class="ff-input" type="text" placeholder="Address" style="width:100%;padding:11px 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#18181b;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;" />
      </div>
    </div>

    <div style="margin-top:auto;padding-top:24px;border-top:1px solid #f0f0f1;display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;gap:12px;">
        <a href="https://www.instagram.com/flavancouver" target="_blank" rel="noopener" class="ff-social" style="width:40px;height:40px;border-radius:10px;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.facebook.com/flavancouver" target="_blank" rel="noopener" class="ff-social" style="width:40px;height:40px;border-radius:10px;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="https://x.com/flavancouver" target="_blank" rel="noopener" class="ff-social" style="width:40px;height:40px;border-radius:10px;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
      <div style="border-top:1px solid #f0f0f1;margin-top:8px;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <a href="https://github.com/flavancouver/game-cards" target="_blank" rel="noopener" class="ff-ghlink" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#18181b;text-decoration:none;"><i class="fa-brands fa-github" style="font-size:16px;"></i>flavancouver/game-cards</a>
        <div style="font-size:12px;color:#a1a1aa;">© FlaVancouver 2017–<span id="copyYear"></span></div>
      </div>
    </div>
  </aside>

  <main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px;min-width:0;">
    <div id="frame" style="width:100%;max-width:560px;aspect-ratio:1/1;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,0.22);background:#2f7d20;">
      <div id="graphic" style="position:absolute;top:0;left:0;width:1080px;height:1080px;transform-origin:top left;background:#2f7d20;overflow:hidden;">

        <img id="fieldImg" src="assets/bg-futebol.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 42%, rgba(255,255,255,0.04), rgba(0,0,0,0.16) 92%);"></div>

        <div style="position:absolute;top:60px;left:60px;width:960px;border-radius:24px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,0.35);">
          <div style="height:94px;background:#000;display:flex;align-items:center;justify-content:center;gap:16px;">
            <div id="cardCompetition" style="font-family:'Oswald',sans-serif;font-weight:600;font-size:34px;letter-spacing:9px;color:#fff;text-transform:uppercase;text-indent:9px;"></div>
            <div id="cardYear" style="font-family:'Oswald',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;color:rgba(255,255,255,0.4);text-indent:2px;"></div>
          </div>
          <div style="height:288px;background:#C4271F;display:flex;">
            <div style="flex:0 0 50%;min-width:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;padding:58px 44px 0 46px;">
              <div style="display:flex;align-items:center;white-space:nowrap;height:38px;">
                <span style="background:#fff;color:#C4271F;font-family:'Oswald',sans-serif;font-weight:700;font-size:27px;text-transform:uppercase;line-height:1;border-radius:4px;height:38px;padding:0 18px 0 12px;display:inline-flex;align-items:center;box-sizing:border-box;"><span id="cardWeekday" style="letter-spacing:0.18em;margin-right:-0.18em;display:block;"></span></span>
              </div>
              <div id="cardDateLine" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:27px;letter-spacing:0.18em;color:rgba(255,255,255,0.82);line-height:1;margin-top:10px;white-space:nowrap;text-align:right;"></div>
              <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:8px;margin-top:10px;white-space:nowrap;">
                <span id="cardTime" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:84px;color:#fff;line-height:1.05;"></span>
                <span id="cardTz" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.1em;color:rgba(255,255,255,0.72);"></span>
              </div>
            </div>
            <div style="flex:none;width:2px;background:rgba(255,255,255,0.35);align-self:flex-start;height:172px;margin-top:58px;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;padding:58px 40px 0 44px;">
              <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:27px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.82);line-height:1;height:37px;display:flex;align-items:center;">Watch Party</div>
              <div id="cardVenueName" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:64px;color:#fff;line-height:1.35;padding-bottom:6px;margin-top:4px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
              <div style="font-family:'Oswald',sans-serif;font-weight:400;font-size:31px;color:#fff;line-height:1.2;margin-top:2px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:baseline;gap:10px;"><i class="fa-solid fa-location-dot" style="font-size:26px;color:rgba(255,255,255,0.7);position:relative;top:-6px;"></i><span id="cardVenueAddr"></span></div>
            </div>
          </div>
          <div style="height:302px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0;position:relative;">
            <div id="sideLeft" style="width:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:none;"></div>
            <div id="sideRight" style="width:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:none;"></div>
            <div style="position:absolute;left:50%;top:53px;transform:translateX(-50%);width:160px;height:160px;">
              <div style="position:absolute;top:50%;left:0;width:100%;height:9px;margin-top:-4.5px;background:rgba(255,255,255,0.4);transform:rotate(45deg);"></div>
              <div style="position:absolute;top:50%;left:0;width:100%;height:9px;margin-top:-4.5px;background:rgba(255,255,255,0.4);transform:rotate(-45deg);"></div>
            </div>
          </div>
        </div>

        <img src="assets/flavancouver.png" style="position:absolute;left:50%;top:762px;transform:translateX(-50%);width:300px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35));" />

        <div style="position:absolute;right:44px;bottom:34px;font-family:'Oswald',sans-serif;font-weight:400;font-size:24px;letter-spacing:0.05em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.55);">@flavancouver</div>
      </div>
    </div>

    <button id="dlBtn" style="width:100%;max-width:560px;padding:16px;background:#C4271F;color:#fff;border:none;border-radius:11px;font-size:16px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;transition:background .15s,opacity .15s;">
      <i class="fa-solid fa-download" style="margin-right:9px;"></i><span id="dlLabel">Download image</span>
    </button>
    <div style="width:100%;max-width:560px;margin-top:-12px;min-height:21px;color:#C4271F;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;">
      <i id="dlErrorIcon" class="fa-solid fa-circle-exclamation" style="display:none;"></i>
      <span id="dlError"></span>
    </div>
    <div style="font-size:12px;color:#a1a1aa;">PNG 1080 × 1080 px</div>
  </main>
</div>

  var NO_CREST = { 'remo': true, 'union-la-calera': true };

  // ---- state ----
  var state = {
    campeonato: 'Campeonato Brasileiro',
    data: (function () { var d = new Date(); d.setDate(d.getDate() + 1); return iso(d); })(),
    horario: '17:00',
    venue: 'mangos',

    customAddress: '',
    customOpp: '',
    homeAway: 'home',

    oppOpen: false,

    missing: {},
  };

  // ---- helpers ----
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function hasCrest(key) { return !!key && key !== 'other' && !NO_CREST[key]; }
  function crestSrc(key) { return 'crests/' + key + '.png'; }
  function ptWeekday(d) { return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d]; }
  function ptMonth(m) { return ['January','February','March','April','May','June','July','August','September','October','November','December'][m]; }
  function ampm(t) {
    if (!t) return '';
    var p = t.split(':').map(Number), H = p[0], M = p[1];
    var ap = H >= 12 ? 'PM' : 'AM';
    var h = H % 12; if (h === 0) h = 12;
    return h + ':' + String(M).padStart(2, '0') + ' ' + ap;
  }
  function stripFlags(name) { return (name || '').replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '').replace(/\s+/g, ' ').trim(); }
  function initials(name) { return (name || '').replace(/[^A-Za-zÀ-ÿ]/g, '').slice(0, 3).toUpperCase(); }
  function oppByKey(key) { for (var i = 0; i < OPP.length; i++) if (OPP[i].key === key) return OPP[i]; return null; }
  function oppDisplayName() {
    if (state.opponent === 'other') return state.customOpp.trim();
    var o = state.opponent ? oppByKey(state.opponent) : null;
    return o ? stripFlags(o.name) : '';
  }
  function norm(x) { return (x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  var _checked = {};
  function ensureCrest(src) {
    if (!src || _checked[src]) return;
    _checked[src] = true;
    var im = new Image();
    im.onerror = function () { state.missing[src] = true; render(); };
    im.src = src;
  }

  // ---- element refs ----
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('frame'), graphic = $('graphic');
  var dateWrap = $('dateWrap'), calPopover = $('calPopover'), calGrid = $('calGrid'), calLabel = $('calLabel');
  var oppInput = $('oppInput'), oppDropdown = $('oppDropdown'), customOppInput = $('customOppInput');
  var oppNameFocusPending = false;

  // ---- populate static selects ----
  (function initSelects() {
    var cs = $('campSelect');
    CAMPEONATOS.forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; cs.appendChild(o); });
    cs.value = state.campeonato;
    var hs = $('hourSelect');
    for (var h = 1; h <= 12; h++) { var o = document.createElement('option'); o.value = String(h); o.textContent = String(h); hs.appendChild(o); }
    var ms = $('minuteSelect');
    ['00','15','30','45'].forEach(function (m) { var o = document.createElement('option'); o.value = m; o.textContent = m; ms.appendChild(o); });
    var vs = $('venueSelect');
    VENUES.forEach(function (v) { var o = document.createElement('option'); o.value = v.key; o.textContent = v.name; vs.appendChild(o); });
    var oo = document.createElement('option'); oo.value = 'other'; oo.textContent = 'Other…'; vs.appendChild(oo);
    vs.value = state.venue;
  })();

  $('copyYear').textContent = new Date().getFullYear();

  // ---- scaling ----
  function updateScale() {
    if (frame && graphic) {
      var w = frame.clientWidth;
      graphic.style.transform = 'scale(' + (w / 1080) + ')';
    }
  }

  // ---- time ----
  function setTime(part, val) {
    var p = (state.horario || '17:00').split(':').map(Number), H = p[0], M = p[1];
    var h12 = H % 12 || 12, ap = H >= 12 ? 'PM' : 'AM', mm = String(M).padStart(2, '0');
    if (part === 'h') h12 = +val;
    if (part === 'm') mm = val;
    if (part === 'ap') ap = val;
    var H24 = h12 % 12; if (ap === 'PM') H24 += 12;
    state.horario = String(H24).padStart(2, '0') + ':' + mm;
    render();
  }

  // ---- opponent selection ----
  function pickOpp(o) {
    if (o.key === 'other') {
      state.opponent = 'other'; state.oppQuery = 'Other'; state.oppOpen = false; state.oppDirty = false; state.dlError = '';
      oppNameFocusPending = true;
      render();
      return;
    }
    state.opponent = o.key; state.oppQuery = o.name; state.oppOpen = false; state.oppDirty = false; state.dlError = '';
    render();
  }

  // ---- download ----
  function download() {
    if (!window.htmlToImage || !graphic) return;
    if (!state.opponent) { state.dlError = 'Choose an opponent to continue.'; render(); return; }
    if (state.opponent === 'other' && !state.customOpp.trim()) { state.dlError = "Enter the opponent's name."; render(); return; }
    if (state.venue === 'other') {
      var vn = state.customName.trim(), va = state.customAddress.trim();
      if (!vn && !va) { state.dlError = 'Enter the venue name and address.'; render(); return; }
      if (!vn) { state.dlError = 'Enter the venue name.'; render(); return; }
      if (!va) { state.dlError = 'Enter the venue address.'; render(); return; }
    }
    if (state.downloading) return;
    state.downloading = true; state.dlError = ''; render();
    window.htmlToImage.toPng(graphic, {
      width: 1080, height: 1080, pixelRatio: 1, cacheBust: true,
      style: { transform: 'none' },
      filter: function (node) { return !(node.tagName === 'IMG' && node.naturalWidth === 0); },
    }).then(function (url) {
      var slug = function (n) { return n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-').replace(/[^A-Za-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, ''); };
      var home = state.homeAway === 'home';
      var advName = oppDisplayName() || 'Opponent';
      var t1 = slug(home ? 'Flamengo' : advName);
      var t2 = slug(home ? advName : 'Flamengo');
      var a = document.createElement('a');
      a.download = state.data + '_' + t1 + '-x-' + t2 + '.png';
      a.href = url;
      a.click();
      state.downloading = false; render();
    }).catch(function (e) {
      console.error(e);
      alert('Erro ao gerar a imagem: ' + e.message);
      state.downloading = false; render();
    });
  }

  // ---- calendar ----
  function buildDateData() {
    var parts = (state.data || '').split('-').map(Number);
    var dt = (parts.length === 3 && !parts.some(isNaN)) ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date();
    return dt;
  }

  function renderCalendar() {
    var dt = buildDateData();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var maxD = new Date(today); maxD.setMonth(maxD.getMonth() + 6);
    var dateMin = iso(today), dateMax = iso(maxD);
    var viewY = state.calY != null ? state.calY : dt.getFullYear();
    var viewM = state.calM != null ? state.calM : dt.getMonth();
    var lead = new Date(viewY, viewM, 1).getDay();
    var dim = new Date(viewY, viewM + 1, 0).getDate();
    var todayIso = iso(today);

    calLabel.textContent = ptMonth(viewM) + ' ' + viewY;
    var viewIdx = viewY * 12 + viewM;
    var minIdx = today.getFullYear() * 12 + today.getMonth();
    var maxIdx = maxD.getFullYear() * 12 + maxD.getMonth();
    $('calPrev').disabled = viewIdx <= minIdx;
    $('calNext').disabled = viewIdx >= maxIdx;

    calGrid.innerHTML = '';
    for (var i = 0; i < 42; i++) {
      var dayNum = i - lead + 1;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ff-day';
      if (dayNum < 1 || dayNum > dim) {
        btn.setAttribute('data-empty', '1');
        btn.disabled = true;
        btn.textContent = '';
        calGrid.appendChild(btn);
        continue;
      }
      var cellIso = iso(new Date(viewY, viewM, dayNum));
      var disabled = cellIso < dateMin || cellIso > dateMax;
      var selected = cellIso === state.data;
      btn.setAttribute('data-empty', '0');
      btn.disabled = disabled;
      btn.setAttribute('data-state', selected ? 'selected' : (cellIso === todayIso ? 'today' : ''));
      btn.textContent = String(dayNum);
      (function (ci, dis) {
        btn.addEventListener('click', function () {
          if (dis) return;
          state.data = ci; state.calOpen = false; render();
        });
      })(cellIso, disabled);
      calGrid.appendChild(btn);
    }
  }

  function stepMonth(delta) {
    var dt = buildDateData();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var maxD = new Date(today); maxD.setMonth(maxD.getMonth() + 6);
    var minIdx = today.getFullYear() * 12 + today.getMonth();
    var maxIdx = maxD.getFullYear() * 12 + maxD.getMonth();
    var by = state.calY != null ? state.calY : dt.getFullYear();
    var bm = state.calM != null ? state.calM : dt.getMonth();
    var idx = Math.min(maxIdx, Math.max(minIdx, by * 12 + bm + delta));
    state.calY = Math.floor(idx / 12); state.calM = idx % 12;
    render();
  }

  // ---- opponent dropdown ----
  function renderOppDropdown() {
    oppDropdown.innerHTML = '';
    var q = norm(state.oppQuery);
    var oppList = (state.oppDirty && q) ? OPP.filter(function (o) { return norm(o.name).includes(q); }) : OPP.slice();
    var rows = oppList.map(function (o) { return { key: o.key, name: o.name, other: false }; });
    rows.push({ key: 'other', name: 'Other (enter name)…', other: true });

    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'ff-oppRow';
      row.style.cssText = 'padding:9px 10px;font-size:15px;color:#18181b;cursor:pointer;display:flex;align-items:center;gap:11px;border-radius:6px;';
      var img = document.createElement('img');
      img.style.cssText = 'width:24px;height:24px;object-fit:contain;flex:none;';
      if (r.other || !hasCrest(r.key)) {
        img.style.visibility = 'hidden';
      } else {
        img.style.visibility = 'visible';
        img.src = crestSrc(r.key);
        img.onerror = function () { img.style.visibility = 'hidden'; };
      }
      var span = document.createElement('span');
      span.textContent = r.name;
      row.appendChild(img); row.appendChild(span);
      row.addEventListener('mousedown', function (e) {
        e.preventDefault();
        pickOpp({ key: r.key });
      });
      oppDropdown.appendChild(row);
    });

    if (oppList.length === 0) {
      // "No team found" appears above the always-present Other row when the filter matches nothing.
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:11px 12px;font-size:14px;color:#a1a1aa;';
      empty.textContent = 'No team found';
      oppDropdown.insertBefore(empty, oppDropdown.lastChild);
    }
  }

  // ---- side (team column) renderer ----
  function renderSide(container, t, miss) {
    container.innerHTML = '';
    var box = document.createElement('div');
    box.style.cssText = 'position:relative;width:212px;height:176px;display:flex;align-items:center;justify-content:center;';

    var hasImg = !t.empty && !t.badge && !miss;
    if (showBadge) {
      var badge = document.createElement('div');
      badge.style.cssText = 'width:142px;height:142px;border-radius:50%;background:#2a2a2a;border:3px solid #4a4a4a;color:#fff;font-family:\'Oswald\',sans-serif;font-weight:700;font-size:42px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;';

      img.style.objectFit = 'contain';

      ph.style.cssText = 'width:142px;height:142px;border-radius:50%;border:2px dashed rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.28);font-family:\'Oswald\',sans-serif;font-weight:700;font-size:60px;line-height:1;';

    name.textContent = t.name || ' ';

    container.appendChild(name);

  // ---- main render ----
  function render() {
    var s = state;
    var p = (s.horario || '17:00').split(':').map(Number), H = p[0], M = p[1];
    var dt = buildDateData();
    var weekday = ptWeekday(dt.getDay());
    var wkAbbr = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
    var moAbbr = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
    var dateDisplay = wkAbbr + ', ' + moAbbr + ' ' + dt.getDate() + ', ' + dt.getFullYear();
    var dateLine = (dt.getDate() + ' ' + ptMonth(dt.getMonth())).toUpperCase();
    var timeLine = ampm(s.horario);
    var tzLabel = s.horario ? 'PT' : '';
    var graphicYear = dt.getFullYear();

    // form: date display
    $('dateDisplay').textContent = dateDisplay;

    // form: competition/time selects (keep in sync)
    $('campSelect').value = s.campeonato;
    $('hourSelect').value = String(H % 12 || 12);
    $('minuteSelect').value = String(M).padStart(2, '0');
    // AM/PM segmented styling
    styleSeg($('amBtn'), H < 12, false);
    styleSeg($('pmBtn'), H >= 12, true);

    // form: venue
    var isOther = s.venue === 'other';
    $('venueSelect').value = s.venue;
    $('customVenueName').style.display = isOther ? '' : 'none';
    $('customVenueAddr').style.display = isOther ? '' : 'none';
    if (document.activeElement !== $('venueNameInput')) $('venueNameInput').value = s.customName;
    if (document.activeElement !== $('venueAddrInput')) $('venueAddrInput').value = s.customAddress;

    // form: home/away
    $('homeRadio').checked = s.homeAway === 'home';
    $('awayRadio').checked = s.homeAway === 'away';

    // form: opponent input + dropdown
    if (document.activeElement !== oppInput) oppInput.value = s.oppQuery;
    oppDropdown.style.display = s.oppOpen ? '' : 'none';
    if (s.oppOpen) renderOppDropdown();
    var isOtherOpp = s.opponent === 'other';
    customOppInput.style.display = isOtherOpp ? '' : 'none';
    if (document.activeElement !== customOppInput) customOppInput.value = s.customOpp;
    if (oppNameFocusPending && isOtherOpp) { oppNameFocusPending = false; setTimeout(function () { customOppInput.focus(); }, 0); }

    // form: calendar
    calPopover.style.display = s.calOpen ? '' : 'none';
    if (s.calOpen) renderCalendar();

    // form: download button disabled look
    var customOppName = s.customOpp.trim();
    var venueOk = !isOther || (!!s.customName.trim() && !!s.customAddress.trim());
    var okToDownload = !!s.opponent && (!isOtherOpp || !!customOppName) && venueOk;
    var dlBtn = $('dlBtn');
    dlBtn.style.opacity = okToDownload ? '1' : '0.5';
    dlBtn.style.cursor = okToDownload ? 'pointer' : 'not-allowed';
    dlBtn.setAttribute('data-disabled', okToDownload ? '0' : '1');
    $('dlLabel').textContent = s.downloading ? 'Generating…' : 'Download image';

    // form: error line
    $('dlError').textContent = s.dlError;
    $('dlErrorIcon').style.display = s.dlError ? '' : 'none';

    // card: header
    $('cardCompetition').textContent = s.campeonato || ' ';
    $('cardYear').textContent = graphicYear;
    $('cardWeekday').textContent = weekday;
    $('cardDateLine').textContent = dateLine;
    $('cardTime').textContent = timeLine;
    $('cardTz').textContent = tzLabel;

    // card: venue
    var v = VENUES.find(function (x) { return x.key === s.venue; });
    var vName = isOther ? s.customName : (v ? v.name : '');
    var vAddr = isOther ? s.customAddress : (v ? v.address : '');
    $('cardVenueName').textContent = vName || ' ';
    $('cardVenueAddr').textContent = vAddr || ' ';

    // card: teams
    var oppSel = (s.opponent && s.opponent !== 'other') ? oppByKey(s.opponent) : null;
    var advDisplay = oppDisplayName();
    var fla = { src: crestSrc('flamengo'), initials: 'FLA', name: 'Flamengo', fla: true };
    var adv;
    if (isOtherOpp) {
      adv = customOppName
        ? { badge: true, initials: initials(customOppName), name: customOppName, fla: false }
        : { empty: true, name: 'TBD', fla: false };
    } else if (oppSel) {
      adv = hasCrest(oppSel.key)
        ? { src: crestSrc(oppSel.key), initials: initials(advDisplay), name: advDisplay, fla: false }
        : { badge: true, initials: initials(advDisplay), name: advDisplay, fla: false };
    } else {
      adv = { empty: true, name: 'TBD', fla: false };
    }
    var home = s.homeAway === 'home';
    var left = home ? fla : adv;
    var right = home ? adv : fla;
    var lMiss = !left.empty && !left.badge && !!s.missing[left.src];
    var rMiss = !right.empty && !right.badge && !!s.missing[right.src];
    renderSide($('sideLeft'), left, lMiss);
    renderSide($('sideRight'), right, rMiss);

    // ensure crest existence checks
    ensureCrest(crestSrc('flamengo'));
    if (s.opponent && hasCrest(s.opponent)) ensureCrest(crestSrc(s.opponent));

    updateScale();
  }

  function styleSeg(btn, active, isPm) {
    btn.style.flex = '1';
    btn.style.padding = '11px 0';
    btn.style.border = 'none';
    btn.style.borderLeft = isPm ? '1px solid #d4d4d8' : 'none';
    btn.style.background = active ? '#18181b' : '#fff';
    btn.style.color = active ? '#fff' : '#71717a';
    btn.style.fontSize = '15px';
    btn.style.fontWeight = '600';
    btn.style.cursor = 'pointer';
    btn.style.transition = 'background .12s, color .12s';
  }

  // ---- events ----
  $('campSelect').addEventListener('change', function (e) { state.campeonato = e.target.value; render(); });
  $('hourSelect').addEventListener('change', function (e) { setTime('h', e.target.value); });
  $('minuteSelect').addEventListener('change', function (e) { setTime('m', e.target.value); });
  $('amBtn').addEventListener('click', function () { setTime('ap', 'AM'); });
  $('pmBtn').addEventListener('click', function () { setTime('ap', 'PM'); });

  $('venueSelect').addEventListener('change', function (e) { state.venue = e.target.value; render(); });
  $('venueNameInput').addEventListener('input', function (e) { state.customName = e.target.value; render(); });
  $('venueAddrInput').addEventListener('input', function (e) { state.customAddress = e.target.value; render(); });

  $('homeRadio').addEventListener('change', function () { state.homeAway = 'home'; render(); });
  $('awayRadio').addEventListener('change', function () { state.homeAway = 'away'; render(); });

  $('dateField').addEventListener('click', function () {
    if (state.calOpen) { state.calOpen = false; }
    else {
      var p = (state.data || '').split('-').map(Number);
      state.calOpen = true; state.calY = p[0] || null; state.calM = (p[1] ? p[1] - 1 : null);
    }
    render();
  });
  $('calPrev').addEventListener('click', function () { stepMonth(-1); });
  $('calNext').addEventListener('click', function () { stepMonth(1); });

  oppInput.addEventListener('input', function (e) { state.oppQuery = e.target.value; state.oppOpen = true; state.oppDirty = true; render(); });
  oppInput.addEventListener('focus', function (e) {
    state.oppOpen = true; state.oppDirty = false; render();
    var t = e.target; setTimeout(function () { try { t.select(); } catch (_) {} }, 0);
  });
  var _oppT;
  oppInput.addEventListener('blur', function () {
    clearTimeout(_oppT);
    _oppT = setTimeout(function () {
      var sel = (state.opponent && state.opponent !== 'other') ? oppByKey(state.opponent) : null;
      state.oppOpen = false; state.oppDirty = false;
      state.oppQuery = sel ? sel.name : (state.opponent === 'other' ? 'Other' : '');
      render();
    }, 140);
  });
  customOppInput.addEventListener('input', function (e) { state.customOpp = e.target.value; render(); });

  $('dlBtn').addEventListener('click', download);

  // outside click / escape for calendar
  document.addEventListener('mousedown', function (e) {
    if (state.calOpen && dateWrap && !dateWrap.contains(e.target)) { state.calOpen = false; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.calOpen) { state.calOpen = false; render(); }
  });

  // resize
  window.addEventListener('resize', updateScale);
  if (window.ResizeObserver) { var ro = new ResizeObserver(updateScale); ro.observe(frame); }

  // initial paint
  render();
  updateScale();
})();
</script>
</body>
</html>
